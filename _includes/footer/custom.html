<!-- start custom footer snippets -->

<!-- Support for MathJax -->
<script defer src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6" data-turbo-eval="false"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" data-turbo-eval="false"></script>

<!-- Support for Mermaid -->
<script type="module" data-turbo-eval="false">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    window.__mermaid = mermaid;
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
    await mermaid.run({ querySelector: 'code.language-mermaid' });
</script>

<!-- Re-render math & diagrams after Turbo navigations -->
<script data-turbo-eval="false">
    document.addEventListener("turbo:load", function () {
        if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise();
        }
        if (window.__mermaid) {
            window.__mermaid.run({ querySelector: 'code.language-mermaid' });
        }
    });
</script>

<!-- end custom footer snippets -->
